<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="Register_style.css">
</head>
<body>
    
    <header>
        <a href="Home_index.html"><img src="Logo.png" alt="Bifix Logo" id="logo"></a>
    </header>

    
    <div class="container">
        <h2>Let's Get Started</h2>
        <p>HAVE AN ACCOUNT? <a href="Login_index.html">LOGIN</a></p>

        
        <form id="registerForm" method="POST">
            <div class="form-group">
                <input type="text" name="first_name" placeholder="First Name" required>
            </div>
            <div class="form-group">
                
                <input type="text" name="last_name" placeholder="Last Name" required>
            </div>
            <div class="form-group">
                
                <input type="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                
                <input type="text" name="contact_number" placeholder="Contact Number" required>
            </div>
             
            <div class="form-group">
                <input type="text" name="user_name" placeholder="User Name" required>
            </div>

            <div class="form-group">
                
                <input type="password" id="create_password" name="create_password" placeholder="Create Password" required minlength="6">
            </div>
            <div class="form-group">
               
                <input type="password" id="confirm_password"name="confirm_password" placeholder="Confirm Password" required minlength="6">
            </div>
            <div class="terms-container">
                <input type="checkbox" id="terms" name="terms" required>
                <placeholder="terms">I agree to the <a href="#">TERMS & CONDITIONS</a>
            </div>
            <button type="submit">Register Now</button>
        </form>
    </div>

    <script 
    src="Register_validation.js"defer></script>
</body>
</html>
